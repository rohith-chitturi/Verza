[project]
name = "verza"
version = "0.1.0-alpha.0"
description = "AI Media Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "dependency-injector>=4.41.0",
    "structlog>=24.0.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "prometheus-client>=0.20.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.1",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.2.5",
    "sentence-transformers>=2.5.0"
]

[project.scripts]
verza = "tools.cli:app"

[project.optional-dependencies]
speech = [
    "faster-whisper>=1.0.0"
]
vision = [
    "easyocr>=1.7.0",
    "opencv-python>=4.9.0,<5.0.0",
    "opencv-python-headless>=4.9.0,<5.0.0",
    "pillow>=10.0.0",
    "scenedetect>=0.6.3",
    "ultralytics>=8.1.0"
]
cognitive = [
    "google-genai>=0.2.0"
]

[tool.uv]
managed = true

[tool.uv.workspace]
members = [
    "core",
    "interfaces",
    "capabilities",
    "providers/speech/whisper"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0"
]

[tool.pytest.ini_options]
pythonpath = [ "." ]
