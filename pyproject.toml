[project]
name = "verza"
version = "0.1.0-alpha.0"
description = "AI Media Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"

[tool.uv]
managed = true

[tool.uv.workspace]
members = [
    "core",
    "interfaces",
    "capabilities",
    "providers/speech/whisper"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0"
]

[tool.pytest.ini_options]
pythonpath = [ "." ]
