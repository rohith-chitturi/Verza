version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: verza_postgres
    environment:
      POSTGRES_USER: verza
      POSTGRES_PASSWORD: verza_password
      POSTGRES_DB: verza_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verza -d verza_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: verza_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: verza_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: verza_prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    # Note: Will need a prometheus.yml config mounted later

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
